<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FacePass PWA - Điểm danh khuôn mặt</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin: 0;
        background-color: #2563eb;
        background-image: linear-gradient(135deg, #2563eb, #4f46e5, #7c3aed);
        color: #fff;
        font: 700 28px/1.4 system-ui, sans-serif;
      }
      #app-splash img { width: 96px; height: 96px; }
      #app-splash small { font-size: 14px; font-weight: 400; }
    </style>
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased select-none font-sans">
    <div id="app-splash" role="status" aria-label="Đang mở FacePass">
      <img src="/favicon.svg" alt="" width="96" height="96" />
      <span>FacePass</span>
      <small>Đang mở ứng dụng…</small>
      <noscript>Vui lòng bật JavaScript để sử dụng FacePass.</noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
